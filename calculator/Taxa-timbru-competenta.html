  <style>
:root {
  --bg: #f5f3ee;
  --surface: #ffffff;
  --surface-2: #faf8f4;
  --ink: #1d2433;
  --muted: #6b7180;
  --line: #e4dfd5;
  --primary: #7a1f2b;
  --primary-ink: #ffffff;
  --primary-soft: #f6e8ea;
  --accent: #1f3a5f;
  --u1: #c0392b;
  --u2: #d97706;
  --u3: #2563eb;
  --u4: #7c8291;
  --ok: #15803d;
  --ok-soft: #e7f5ec;
  --warn-soft: #fdf3e2;
  --danger-soft: #fbe9e7;
  --shadow: 0 1px 2px rgba(20, 20, 30, .06), 0 4px 14px rgba(20, 20, 30, .05);
  --radius: 12px;
  --sidebar: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131519;
    --surface: #1c1f26;
    --surface-2: #22262e;
    --ink: #e9e7e2;
    --muted: #9aa0ad;
    --line: #2f343e;
    --primary: #d36b7b;
    --primary-ink: #1a0d10;
    --primary-soft: #3a2228;
    --accent: #8fb3e0;
    --u1: #ef6b5d;
    --u2: #f0a23b;
    --u3: #6b9bf5;
    --u4: #8d93a0;
    --ok: #4ade80;
    --ok-soft: #173323;
    --warn-soft: #3a2d15;
    --danger-soft: #3d1f1c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131519;
  --surface: #1c1f26;
  --surface-2: #22262e;
  --ink: #e9e7e2;
  --muted: #9aa0ad;
  --line: #2f343e;
  --primary: #d36b7b;
  --primary-ink: #1a0d10;
  --primary-soft: #3a2228;
  --accent: #8fb3e0;
  --u1: #ef6b5d;
  --u2: #f0a23b;
  --u3: #6b9bf5;
  --u4: #8d93a0;
  --ok: #4ade80;
  --ok-soft: #173323;
  --warn-soft: #3a2d15;
  --danger-soft: #3d1f1c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h2 { font-size: 1.05rem; }
h3 { font-size: .95rem; }
.muted { color: var(--muted); }
.red { color: var(--u1); font-weight: 600; }
.small { font-size: .85rem; }
.spacer { flex: 1; }
.nowrap { white-space: nowrap; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  padding: 16px 12px;
  overflow-y: auto;
  z-index: 30;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 16px; }
.brand strong { display: block; font-size: .8rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.brand span { font-weight: 700; font-size: 1.02rem; }
nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 9px;
  color: var(--ink); text-decoration: none; font-weight: 500;
}
nav a:hover { background: var(--surface-2); }
nav a.active { background: var(--primary-soft); color: var(--primary); }
nav a .count { margin-left: auto; background: var(--primary); color: var(--primary-ink); border-radius: 99px; font-size: .72rem; padding: 1px 7px; font-weight: 700; }
nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
.sidebar-foot { margin-top: auto; padding: 12px 8px 0; font-size: .78rem; color: var(--muted); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn { display: none; }
.search {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 0 10px; width: min(360px, 40vw); color: var(--muted);
}
.search input { border: 0; background: transparent; padding: 9px 0; width: 100%; color: var(--ink); font: inherit; outline: none; }
.view { padding: 22px 24px 60px; max-width: 1280px; width: 100%; }
.scrim { display: none; }

@media (max-width: 900px) {
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .app.menu-open .sidebar { transform: none; }
  .app.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 25; }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 10px 16px; gap: 8px; flex-wrap: wrap; }
  .search { order: 5; width: 100%; margin-left: 0; }
  .add-btn { margin-left: auto; }
  .view { padding: 16px 16px 60px; }
}

/* ---------- Componente ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 9px; font: inherit; font-weight: 600; font-size: .9rem;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--u1); border-color: color-mix(in srgb, var(--u1) 40%, var(--line)); }
.btn.sm { padding: 5px 10px; font-size: .82rem; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent;
  color: var(--muted); cursor: pointer; font-size: 1rem; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px;
}
.card + .card { margin-top: 14px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head .btn, .card-head .icon-btn { margin-left: auto; }
.card-head .btn + .btn { margin-left: 0; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar select, .toolbar input { font: inherit; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }

.pill { display: inline-block; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.pill.u1 { background: color-mix(in srgb, var(--u1) 16%, transparent); color: var(--u1); }
.pill.u2 { background: color-mix(in srgb, var(--u2) 18%, transparent); color: var(--u2); }
.pill.u3 { background: color-mix(in srgb, var(--u3) 14%, transparent); color: var(--u3); }
.pill.u4 { background: color-mix(in srgb, var(--u4) 16%, transparent); color: var(--u4); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.tag { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); text-decoration: none; white-space: nowrap; }
a.tag:hover { border-color: var(--accent); color: var(--accent); }

.callout { border-radius: 10px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); font-size: .9rem; }
.callout.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--u2) 35%, var(--line)); }
.callout.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--u1) 35%, var(--line)); }
.callout p { margin: 0 0 6px; } .callout p:last-child { margin: 0; }
.empty { color: var(--muted); font-size: .9rem; padding: 8px 2px; }

/* ---------- Statistici ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
.stat b { display: block; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }
.stat.alert b { color: var(--u1); }

/* ---------- Sarcini ---------- */
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.quick input[name=title] { flex: 1 1 260px; }
.quick input, .quick select { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.day-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.day-head h3 { text-transform: capitalize; }
.day-head .badge { font-size: .75rem; color: var(--muted); }
.day-head .icon-btn { margin-left: auto; }
.day.today { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.day.today .day-head { background: var(--primary-soft); }
.day.overdue .day-head { background: var(--danger-soft); }
.day.overdue .day-head h3 { color: var(--u1); }
.day .empty { padding: 10px 14px; }
ul.tasks, ul.list { list-style: none; margin: 0; padding: 0; }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--line); border-left: 4px solid transparent; }
.task:last-child { border-bottom: 0; }
.task.u1 { border-left-color: var(--u1); } .task.u2 { border-left-color: var(--u2); }
.task.u3 { border-left-color: var(--u3); } .task.u4 { border-left-color: var(--u4); }
.card .task { padding-left: 10px; padding-right: 4px; }
.chk { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--primary); cursor: pointer; flex: none; }
.task-body { flex: 1; min-width: 0; }
.task-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.task-title { font-weight: 600; cursor: pointer; }
.task.done .task-title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.task.done { opacity: .7; }
textarea.note {
  width: 100%; margin-top: 6px; resize: none; overflow: hidden;
  border: 1px dashed transparent; border-radius: 7px; background: transparent;
  padding: 4px 6px; font: inherit; font-size: .88rem; color: var(--ink); min-height: 28px;
}
textarea.note::placeholder { color: var(--muted); opacity: .7; }
textarea.note:hover { border-color: var(--line); }
textarea.note:focus { outline: none; border: 1px solid var(--accent); background: var(--surface-2); }
.agenda-item { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: .9rem; background: color-mix(in srgb, var(--accent) 5%, transparent); }
.agenda-item .grow { flex: 1; min-width: 0; }
.agenda-item .time { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 44px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--u4); }
.dot.termen { background: var(--primary); } .dot.anaf { background: var(--u2); }
.dot.intalnire { background: var(--u3); } .dot.personal { background: var(--ok); }
.dot.todo { background: transparent; border: 2px solid var(--u3); }
.dot.expira { background: var(--u1); }
.group-title { margin: 18px 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }

ul.list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
ul.list li:last-child { border-bottom: 0; }
ul.list .grow { flex: 1; min-width: 0; }
ul.list .grow > * { display: block; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Tabele ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tfoot td { font-weight: 700; border-top: 2px solid var(--line); }

/* ---------- Dosar ---------- */
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 18px; margin-top: 12px; }
.info-grid div span { display: block; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.info-grid div b { font-weight: 600; }
.case-title { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.case-title h2 { font-size: 1.3rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* ---------- Documente ---------- */
.doc { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.doc:last-child { border-bottom: 0; }
.doc-ico { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: .65rem; font-weight: 800; background: var(--primary-soft); color: var(--primary); flex: none; text-transform: uppercase; }
.doc-main { flex: 1; min-width: 0; }
.doc-main a { font-weight: 600; text-decoration: none; color: var(--ink); cursor: pointer; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-main a:hover { color: var(--accent); }
.doc-main small { color: var(--muted); }
details.case-docs { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; box-shadow: var(--shadow); }
details.case-docs summary { padding: 12px 16px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-weight: 600; list-style: none; }
details.case-docs summary::-webkit-details-marker { display: none; }
details.case-docs summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
details.case-docs[open] summary::before { transform: rotate(90deg); }
details.case-docs .inner { padding: 0 16px 12px; }

/* ---------- Calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-head h2 { font-size: 1.2rem; text-transform: capitalize; min-width: 170px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--line); gap: 1px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.cal .dow { background: var(--surface-2); text-align: center; font-size: .75rem; font-weight: 700; color: var(--muted); padding: 6px 0; text-transform: uppercase; }
.cal .cell { background: var(--surface); min-height: 96px; padding: 4px 5px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal .cell:hover { background: var(--surface-2); }
.cal .cell.other { background: var(--bg); color: var(--muted); }
.cal .cell.off .n { color: var(--u1); }
.cal .cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal .n { font-size: .8rem; font-weight: 700; }
.cal .cell.today .n { background: var(--primary); color: var(--primary-ink); border-radius: 99px; padding: 0 7px; align-self: flex-start; }
.chip { font-size: .72rem; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--surface-2); border-left: 3px solid var(--u4); }
.chip.termen { border-color: var(--primary); } .chip.anaf { border-color: var(--u2); }
.chip.intalnire { border-color: var(--u3); } .chip.personal { border-color: var(--ok); }
.chip.todo { border-color: var(--u3); border-left-style: dotted; } .chip.expira { border-color: var(--u1); }
.chip.done { text-decoration: line-through; opacity: .6; }
.more { font-size: .7rem; color: var(--muted); }
@media (max-width: 700px) {
  .cal .cell { min-height: 58px; }
  .chip { font-size: 0; padding: 0; height: 5px; border-left-width: 0; border-radius: 3px; }
  .chip.termen { background: var(--primary); } .chip.anaf { background: var(--u2); }
  .chip.intalnire { background: var(--u3); } .chip.personal { background: var(--ok); }
  .chip.todo { background: var(--u3); opacity: .5; } .chip.expira { background: var(--u1); }
  .chip.altul { background: var(--u4); }
  .more { display: none; }
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Linkuri ---------- */
.link-card { display: flex; gap: 12px; align-items: flex-start; }
.link-card .fav { width: 36px; height: 36px; border-radius: 9px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.link-card a.title { font-weight: 700; text-decoration: none; color: var(--ink); }
.link-card a.title:hover { color: var(--accent); }
.link-card small { display: block; color: var(--muted); word-break: break-all; }

/* ---------- Modal / formulare ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 16px; padding: 0;
  background: var(--surface); color: var(--ink);
  width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(15, 15, 25, .45); }
dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
dialog header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
dialog header h2 { font-size: 1.1rem; }
dialog header .icon-btn { margin-left: auto; }
dialog .fields { padding: 16px 20px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
dialog footer { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 600; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field small { font-weight: 400; color: var(--muted); }
.field input, .field select, .field textarea {
  font: inherit; font-weight: 400; font-size: .95rem; padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); border-color: var(--accent); }
.field.check { flex-direction: row; align-items: center; gap: 8px; }
.field.check input { width: 18px; height: 18px; accent-color: var(--primary); }
@media (max-width: 560px) { dialog .fields { grid-template-columns: 1fr; } }

#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px;
  font-weight: 600; font-size: .9rem; opacity: 0; pointer-events: none; transition: .2s; z-index: 100;
  max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a.active { color: var(--primary); border-color: var(--primary); }

.calc-result { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-transform: capitalize; }
.steps { margin: 8px 0 0; padding-left: 18px; font-size: .9rem; }
.steps li { margin-bottom: 4px; }
.calc-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }

/* ---------- Acces rapid pe prima pagină ---------- */
.launch { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
.launch-btn {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  text-decoration: none; color: var(--ink); border-left: 5px solid var(--lc);
}
.launch-btn:hover { border-color: var(--lc); }
.launch-btn .fav { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; background: var(--lc); flex: none; }
.launch-btn b { display: block; font-size: 1rem; }
.launch-btn small { color: var(--muted); }
.launch-btn .go { margin-left: auto; color: var(--muted); }
.l-claude { --lc: #c96442; } .l-rejust { --lc: #1f3a5f; } .l-portal { --lc: #7a1f2b; } .l-ghiseul { --lc: #15803d; }
.gmail { --mail: #d93025; }
.yahoo { --mail: #6001d2; }
:root[data-theme="dark"] .yahoo { --mail: #a46cff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .yahoo { --mail: #a46cff; } }
:root[data-theme="dark"] .l-rejust { --lc: #4f7fc0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .l-rejust { --lc: #4f7fc0; } }

/* ---------- Calendar compact (prima pagină) ---------- */
.minical .card-head { gap: 4px; }
.minical .card-head h2 { flex: 1; text-align: center; text-transform: capitalize; }
.minical .card-head .btn { margin-left: 6px; }
.mc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mc-dow { text-align: center; font-size: .7rem; font-weight: 700; color: var(--muted); padding: 2px 0 4px; }
.mc-day { border: 0; background: transparent; border-radius: 8px; padding: 4px 0 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); font: inherit; font-size: .85rem; }
.mc-day:hover { background: var(--surface-2); }
.mc-day.other { color: var(--muted); opacity: .55; }
.mc-day.off span { color: var(--u1); }
.mc-day.today span { background: var(--primary); color: var(--primary-ink); border-radius: 99px; padding: 0 7px; font-weight: 700; }
.mc-day i { display: flex; gap: 2px; height: 6px; }
.mc-day i .dot { width: 5px; height: 5px; }
.side-mail { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 4px 12px; }
.side-mail a { text-align: center; font-size: .8rem; font-weight: 700; padding: 7px 4px; border-radius: 8px; text-decoration: none; color: var(--mail); background: color-mix(in srgb, var(--mail) 10%, transparent); }
.side-mail a:hover { background: color-mix(in srgb, var(--mail) 18%, transparent); }

/* ---------- Semnătură electronică ---------- */
.sign-btn { color: var(--primary); }
dialog.wide { width: min(1180px, calc(100vw - 24px)); }
.sign-layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; padding: 16px 20px; overflow-y: auto; }
.sign-stage { background: var(--bg); border-radius: 10px; padding: 12px; display: flex; justify-content: center; align-items: flex-start; min-height: 300px; overflow: auto; }
.page-wrap { position: relative; box-shadow: 0 2px 12px rgba(0,0,0,.25); background: #fff; cursor: crosshair; touch-action: none; line-height: 0; }
.sig-overlay { position: absolute; cursor: move; outline: 2px dashed var(--accent); outline-offset: 2px; background: rgba(37, 99, 235, .06); user-select: none; }
.sign-side { display: flex; flex-direction: column; gap: 10px; }
.pager { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-weight: 600; font-size: .9rem; }
@media (max-width: 760px) { .sign-layout { grid-template-columns: 1fr; } }
.pad-body { padding: 16px 20px; }
.pad-wrap { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 10px; height: 230px; }
.pad-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; z-index: 1; }
.pad-line { position: absolute; left: 6%; right: 6%; bottom: 52px; border-bottom: 1.5px solid #c9c4b8; }
.pad-x { position: absolute; left: 4%; bottom: 56px; color: #b0aa9c; font-size: 1.1rem; }
.sig-preview { background: #fff repeating-conic-gradient(#f3f1ec 0 25%, #fff 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); border-radius: 10px; height: 150px; display: flex; align-items: center; justify-content: center; padding: 10px; }
.sig-preview img { max-height: 100%; max-width: 100%; }
.sig-preview.empty { background: var(--surface-2); color: var(--muted); font-size: .9rem; text-align: center; padding: 20px; }
label.btn input[type=file] { display: none; }
.field select, .field input, .field textarea { max-width: 100%; }
.comp { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.comp h3 { margin: 0 0 8px; font-size: 1rem; }
.comp dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: .92rem; }
.comp dt { font-weight: 700; color: var(--muted, inherit); }
.comp dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) { .comp dl { grid-template-columns: minmax(0, 1fr); } .comp dd { margin-bottom: 6px; } }
.grila .actions .btn, .card .actions .btn { white-space: normal; max-width: 100%; text-align: center; }
pre.minuta { white-space: pre-wrap; font: inherit; font-size: .88rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin: 6px 0; user-select: all; }

.calc-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.calc-top strong { display: block; font-size: 1.1rem; }
.calc-top span { color: var(--muted); font-size: .85rem; }
.calc-main { max-width: 1320px; margin: 0 auto; padding: 16px; }
.calc-foot { max-width: 1320px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: .82rem; }
#nou { margin: 0 0 14px; }

<script>
'use strict';
/* Calculul taxei judiciare de timbru (O.U.G. nr. 80/2013), în forma modificată prin Legea nr. 268/2024
   (în vigoare din 3.11.2024: art. 5 – partaj, art. 15 – familie) și Legea nr. 199/2025 (o scutire nouă, art. 29 alin. (6)).
   Verificat cu textul consolidat al ordonanței (portal legislativ, inclusiv RIL nr. 22/2025) și cu planul de seminar INM
   „Taxele judiciare de timbru și asistența judiciară”.
   Punctul de plecare a fost calculatorul „TJT_complex.xlsm”, depășit la partaj și divorț și cu câteva erori;
   fiecare regulă a fost confruntată cu textul consolidat al ordonanței. „nota” = precizare (practică neunitară etc.). */

// Baremul de la art. 3 alin. (1)
function barem(v) {
  if (v <= 0) return 0;
  if (v <= 500) return Math.max(v * 0.08, 20);
  if (v <= 5000) return 40 + (v - 500) * 0.07;
  if (v <= 25000) return 355 + (v - 5000) * 0.05;
  if (v <= 50000) return 1355 + (v - 25000) * 0.03;
  if (v <= 250000) return 2105 + (v - 50000) * 0.02;
  return 6105 + (v - 250000) * 0.01;
}
function baremPasi(v) {
  if (v <= 500) return `8% din ${lei(v)}${v * 0.08 < 20 ? ', dar nu mai puțin de 20 lei' : ''}`;
  if (v <= 5000) return `40 lei + 7% din ce depășește 500 lei (${lei(v - 500)})`;
  if (v <= 25000) return `355 lei + 5% din ce depășește 5.000 lei (${lei(v - 5000)})`;
  if (v <= 50000) return `1.355 lei + 3% din ce depășește 25.000 lei (${lei(v - 25000)})`;
  if (v <= 250000) return `2.105 lei + 2% din ce depășește 50.000 lei (${lei(v - 50000)})`;
  return `6.105 lei + 1% din ce depășește 250.000 lei (${lei(v - 250000)})`;
}
const lei = n => (Math.round(n * 100) / 100).toLocaleString('ro-RO', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' lei';

/* Tipuri de reguli:
   barem  – baremul art. 3 aplicat valorii (cota = parte din valoare luată ca bază; jumatate; plus = sumă fixă adăugată; plafon)
   procent – p% din valoare, minim 20 lei (jumatate; plus)
   fix    – sumă fixă (unitate = se înmulțește cu un număr: participanți, motive)
   prag   – până la „limita” inclusiv: „sub”; peste: „peste”
   procentPlafon – p% din valoare, cel mult „plafon”
   jumatate – jumătate din taxa introdusă
   proc50 – 50% din taxa de la fond (din: 'barem' = calculată după art. 3 alin. (1) la suma contestată; 'taxa' = introdusă), cel puțin „min”
   scutit; netaxabil – cerere care nu se taxează
   imob: true – poate privi un imobil (art. 31 alin. (3): valoarea impozabilă, grila notarială dacă e contestată);
   'mereu' – privește întotdeauna un imobil */
const TAXE = [

  ['Acțiuni evaluabile în bani', 'v1', 'Acțiuni și cereri evaluabile în bani (pretenții, despăgubiri etc.)', 'art. 3 alin. (1)', { k: 'barem' }, '', 'Prestații succesive pe durată nedeterminată: taxa se calculează la valoarea prestației anuale [art. 31 alin. (4)]. Dacă valoarea este micșorată după înregistrare, taxa rămâne la valoarea inițială (art. 37).'],

// Ce trebuie introdus pentru fiecare tip de regulă
const taxaNum = x => Math.max(0, Number(String(x ?? '').replace(/\s/g, '').replace(',', '.')) || 0);
const taxaImob = (t, v) => !!t.rule.imob && (t.rule.imob === 'mereu' || !!v.imob);
// Valoarea la care se calculează taxa: valoarea impozabilă sau, dacă aceasta e contestată/derizorie, grila notarială [art. 31 alin. (3)]
const taxaGrila = (t, v) => taxaImob(t, v) && !!v.contest && taxaNum(v.vgrila) > 0;
const taxaValoare = (t, v) => (taxaGrila(t, v) ? taxaNum(v.vgrila) : taxaNum(v.valoare));

function taxaCampuri(t) {
  const r = t.rule;
  if (r.k === 'barem' || r.k === 'procent' || r.k === 'prag' || r.k === 'procentPlafon' || r.k === 'jumatate' || r.k === 'proc50') {
    const l = r.eticheta || 'Valoarea obiectului cererii (lei)';
    const imob = taxaImob(t, TX.vals);
    if (imob && r.imob === 'mereu' && !r.eticheta) return [{ n: 'valoare', l: 'Valoarea impozabilă a imobilului (lei)' }];
    return [{ n: 'valoare', l: imob ? l.replace(' (lei)', ' (lei) – pentru imobile, valoarea impozabilă') : l }];
  }
  if (r.k === 'contestatie') return [{ n: 'debit', l: 'Valoarea debitului urmărit (lei)' }, { n: 'bunuri', l: 'Valoarea bunurilor urmărite (lei) – opțional' }];
  if (r.k === 'fix' && r.unitate) return [{ n: 'numar', l: r.unitate, implicit: 1 }];
  return [];
}

// Calculul propriu-zis: { suma, pasi[], scutit }
function taxaCalcul(t, v) {
  const r = t.rule, pasi = [];
  const num = taxaNum;
  let suma = 0;
  const camp = taxaCampuri(t)[0];
  const V = taxaValoare(t, v);
  if (camp && camp.n === 'valoare' && !V) return { suma: 0, lipsa: true, pasi: ['Introduceți valoarea pentru a calcula taxa.'] };
  if (camp && camp.n === 'debit' && !num(v.debit) && !num(v.bunuri)) return { suma: 0, lipsa: true, pasi: ['Introduceți valoarea pentru a calcula taxa.'] };
  if (taxaGrila(t, v)) pasi.push(`Valoarea impozabilă fiind contestată sau vădit derizorie, se ia valoarea după grila notarială: ${lei(V)} [art. 31 alin. (3)]`);
  else if (taxaImob(t, v) && num(v.valoare)) pasi.push(`Imobil: se ia valoarea impozabilă ${lei(V)} [art. 31 alin. (3)]`);
  switch (r.k) {
    case 'scutit': return { suma: 0, scutit: true, pasi: ['Cererea este scutită de taxa judiciară de timbru.'] };
    case 'netaxabil': return { suma: 0, scutit: true, netaxabil: true, pasi: ['Cererea nu se taxează.'] };
    case 'proc50': {
      const baza = r.din === 'barem' ? barem(V) : V;
      if (r.din === 'barem') pasi.push(`Taxa la suma contestată – barem art. 3 alin. (1): ${baremPasi(V)} = ${lei(baza)}`);
      else pasi.push(`Taxa de referință: ${lei(baza)}`);
      suma = baza / 2;
      pasi.push(`50%: ${lei(suma)}`);
      if (suma < r.min) { suma = r.min; pasi.push(`Minimum ${lei(r.min)}`); }
      break;
    }
    case 'fix': {
      const n = r.unitate ? Math.max(1, Math.round(num(v.numar) || 1)) : 1;
      suma = r.suma * n;
      pasi.push(r.unitate ? `${lei(r.suma)} × ${n} = ${lei(suma)}` : `Taxă fixă: ${lei(r.suma)}`);
      break;
    }
    case 'barem': {
      const val = V;
      const baza = r.cota ? val * r.cota : val;
      if (r.cota) pasi.push(`Baza de calcul: ${r.cota * 100}% din ${lei(val)} = ${lei(baza)}`);
      let x = barem(baza);
      pasi.push(`Barem art. 3 alin. (1): ${baremPasi(baza)} = ${lei(x)}`);
      for (let k = 0; k < Number(r.jumatate || 0); k++) { x /= 2; pasi.push(`Jumătate: ${lei(x)}`); }
      if (r.plus) { pasi.push(`Plus taxa fixă de ${lei(r.plus)}: ${lei(x + r.plus)}`); x += r.plus; }
      suma = x;
      break;
    }
    case 'procent': {
      const val = V;
      let x = val * r.p / 100;
      pasi.push(`${r.p}% din ${lei(val)} = ${lei(x)}`);
      if (x < 20) { x = 20; pasi.push('Minimum 20 lei'); }
      if (r.jumatate) { x /= 2; pasi.push(`Jumătate: ${lei(x)}`); }
      if (r.plus) { pasi.push(`Plus ${lei(r.plus)}: ${lei(x + r.plus)}`); x += r.plus; }
      suma = x;
      break;
    }
    case 'prag': {
      const val = V;
      suma = val <= r.limita ? r.sub : r.peste;
      pasi.push(`Valoare ${val <= r.limita ? 'de până la' : 'de peste'} ${lei(r.limita)}: ${lei(suma)}`);
      break;
    }
    case 'procentPlafon': {
      const val = V;
      suma = Math.min(val * r.p / 100, r.plafon);
      pasi.push(`${r.p}% din ${lei(val)} = ${lei(val * r.p / 100)}${val * r.p / 100 > r.plafon ? `, plafonat la ${lei(r.plafon)}` : ''}`);
      break;
    }
    case 'jumatate': {
      const val = V;
      suma = val / 2;
      pasi.push(`Jumătate din ${lei(val)} = ${lei(suma)}`);
      break;
    }
    case 'contestatie': {
      const d = num(v.debit), b = num(v.bunuri);
      const baza = d && b ? Math.min(d, b) : (d || b);
      if (d && b) pasi.push(`Se ia valoarea mai mică dintre debit (${lei(d)}) și bunuri (${lei(b)}): ${lei(baza)}`);
      const x = barem(baza);
      pasi.push(`Barem art. 3 alin. (1): ${baremPasi(baza)} = ${lei(x)}`);
      suma = Math.min(x, 1000);
      if (x > 1000) pasi.push('Plafon: cel mult 1.000 lei');
      break;
    }
  }
  return { suma: Math.round(suma * 100) / 100, pasi };
}

function taxaText() {
  if (!TX.cos.length) return '';
  const total = TX.cos.reduce((s, x) => s + x.suma, 0);
  const linii = TX.cos.map((x, i) => `${i + 1}. ${x.label}${x.detaliu ? ' (' + x.detaliu + ')' : ''} – ${taxaSuma(x)}, potrivit ${x.temei || x.art + ' din O.U.G. nr. 80/2013'}`);
  const comp = compText(TX.cos);
  return `Taxa judiciară de timbru datorată este în cuantum de ${lei(total)}, după cum urmează:\n${linii.join(';\n')}.${comp ? '\n\n' + comp : ''}`;
}

function taxaAdauga() {
  const t = TAXE.find(x => x.id === TX.sel);
  if (!t) return;
  const rez = taxaCalcul(t, TX.vals);
  if (rez.lipsa) return toast('Introduceți mai întâi valoarea.');
  const campuri = taxaCampuri(t).filter(f => TX.vals[f.n]).map(f => ({ ...f, l: f.l.replace(/ – pentru imobile.*$/, '') }));
  if (taxaGrila(t, TX.vals)) campuri.push({ n: 'vgrila', l: 'Valoarea după grila notarială, folosită pentru taxă (lei)' });
  const opt = COMP[t.id]?.opt;
  const detaliu = campuri.map(f => `${f.l.replace(/ \(lei\).*$/, '').replace(/ – opțional$/, '')}: ${f.n === 'numar' ? TX.vals[f.n] : lei(Number(String(TX.vals[f.n]).replace(/\s/g, '').replace(',', '.')) || 0)}`).join(', ');
  const comp = compCalcul(t, TX.vals);
  const label = opt ? `${t.label} – ${opt[Math.min(opt.length - 1, Number(TX.vals.co) || 0)].l}` : t.label;
  TX.cos.push({ temei: taxaTemei(t), netaxabil: !!rez.netaxabil, label, art: t.art, suma: rez.suma, scutit: !!rez.scutit, detaliu, comp });
  rerender();
}

/* Rezultatul pentru un obiect: { gen, inst, grad, temei, ter, notes[], verif[], lipsa } */
function compCalcul(t, v) {
  const c = COMP[t.id];
  if (!c) return null;
  const num = x => Math.max(0, Number(String(x ?? '').replace(/\s/g, '').replace(',', '.')) || 0);
  const out = { gen: c.g || 'Instanțele judecătorești', ter: c.t, notes: c.n ? [c.n] : [], verif: c.v ? [c.v] : [], optiuni: c.opt || null };
  let m = c.m;
  if (c.opt) {
    const o = c.opt[Math.min(c.opt.length - 1, Number(v.co) || 0)];
    m = o.val ? VAL : { inst: o.inst, grad: o.grad, temei: o.temei || c.temei };
    if (o.t) out.ter = o.t; else if (!c.t && o.val) out.ter = T_GEN;
    if (o.v) out.verif.push(o.v);
    if (o.val) out.notes.push(N_VALOARE);
  }
  if (m && m.val) {
    const camp = c.vl || !taxaCampuri(t).some(x => x.n === 'valoare') ? 'cv' : 'valoare';
    const val = num(v[camp]);
    const extra = c.extra ? `; ${c.extra}` : '';
    if (!val) Object.assign(out, { inst: 'Judecătoria (până la 200.000 lei inclusiv) sau Tribunalul (peste 200.000 lei)', grad: 0, temei: `art. 94 pct. 1 lit. k), art. 95 pct. 1 ${CPC}${extra}`, lipsa: true });
    else if (val <= PRAG_JUD) Object.assign(out, { inst: 'Judecătoria', grad: 1, temei: `art. 94 pct. 1 lit. k) ${CPC} – cereri evaluabile în bani de până la 200.000 lei inclusiv${extra}` });
    else Object.assign(out, { inst: 'Tribunalul', grad: 2, temei: `art. 95 pct. 1 ${CPC} – cereri evaluabile în bani de peste 200.000 lei${extra}` });
  } else if (m) Object.assign(out, { inst: m.inst, grad: m.grad || 0, temei: m.temei });
  if (F127_TEXT[v.f127]) out.f127 = F127_TEXT[v.f127];
  if (typeof taxaGrila === 'function' && taxaGrila(t, v)) out.notes.unshift('Competența se raportează la valoarea impozabilă (art. 104 C.proc.civ.), chiar dacă taxa se calculează după grila notarială [art. 31 alin. (3) O.U.G. nr. 80/2013].');
  return out;
}

function compCampuri(t) {
  const c = COMP[t.id];
  if (!c) return [];
  const f = [];
  if (c.opt) f.push({ n: 'co', l: 'Situația concretă', opt: c.opt.map(o => o.l) });
  f.push({ n: 'f127', l: 'Calitatea părților (competența facultativă – art. 127)', opt: F127 });
  const o = c.opt && c.opt[Math.min(c.opt.length - 1, Number(TX.vals.co) || 0)];
  if (c.vl) f.push({ n: 'cv', l: c.vl });
  else if ((c.m && c.m.val) || (o && o.val)) {
    if (!taxaCampuri(t).some(x => x.n === 'valoare')) f.push({ n: 'cv', l: 'Valoarea obiectului cererii (lei) – pentru competență' });
  }
  return f;
}

/* Competența pentru toate capetele de cerere din coș */
function compAgregat(cos) {
  const items = cos.filter(x => x.comp);
  if (!items.length) return null;
  const linii = [];
  const cuGrad = items.filter(x => x.comp.grad > 0);
  const faraGrad = items.filter(x => !(x.comp.grad > 0));
  const NUME = { 1: 'Judecătoria', 2: 'Tribunalul', 3: 'Curtea de apel' }, DE = { 1: 'judecătorie', 2: 'tribunal', 3: 'curtea de apel' };
  if (cuGrad.length) {
    const max = Math.max(...cuGrad.map(x => x.comp.grad));
    const diferite = new Set(cuGrad.map(x => x.comp.grad)).size > 1;
    if (!diferite) linii.push(`Competența materială: ${NUME[max]} pentru ${cuGrad.length === items.length ? 'toate capetele' : 'capetele cu instanță determinată'}.`);
    else linii.push(`Capetele țin de instanțe de grad diferit. Dacă sunt întemeiate pe un titlu comun ori pe aceeași cauză sau sunt în strânsă legătură, se judecă toate de ${DE[max]} – instanța mai mare în grad (art. 99 alin. (2) ${CPC}); dacă au cauze diferite, competența se stabilește pentru fiecare capăt în parte (art. 99 alin. (1)).`);
  }
  linii.push(`Cererile accesorii, adiționale și incidentale se judecă de instanța competentă pentru cererea principală (art. 123 ${CPC}). Pentru competență contează doar capătul principal, fără accesorii (art. 98 alin. (2)), deși taxa se datorează pentru fiecare capăt (art. 34 alin. (1) O.U.G. nr. 80/2013).`);
  if (faraGrad.length) linii.push(`Instanța se stabilește după regula proprie pentru: ${faraGrad.map(x => x.label).join('; ')}.`);
  const excl = items.filter(x => x.comp.ter && x.comp.ter.ex === true);
  const cond = items.filter(x => x.comp.ter && x.comp.ter.ex === 'cond');
  if (excl.length) linii.push(`Atenție – competență teritorială exclusivă: ${excl.map(x => `${x.label} (${x.comp.ter.temei})`).join('; ')}. Ea nu poate fi înlăturată prin alegerea reclamantului sau prin convenția părților.`);
  if (cond.length) linii.push(`Verificați dacă devine exclusivă (imobil, moștenire, ocrotire): ${cond.map(x => x.label).join('; ')}.`);
  if (items.some(x => /divor/i.test(x.label)) && items.length > 1) linii.push('Cererile formulate odată cu divorțul urmează competența instanței divorțului.');
  const f127 = items.find(x => x.comp.f127);
  if (f127) linii.push(f127.comp.f127);
  if (items.some(x => x.comp.verif && x.comp.verif.length)) linii.push('Unele capete au puncte marcate „de verificat”.');
  return linii;
}

function compText(cos) {
  const items = cos.filter(x => x.comp);
  if (!items.length) return '';
  const linii = items.map((x, i) => `${i + 1}. ${x.label} – competența materială: ${x.comp.inst || '—'}${x.comp.temei ? ' (' + x.comp.temei + ')' : ''}; competența teritorială: ${(x.comp.ter?.r || '—').replace(/\.$/, '')}${x.comp.ter?.temei ? ' (' + x.comp.ter.temei + ')' : ''}${x.comp.ter?.ex === true ? ' – competență exclusivă' : ''}`);
  const ag = compAgregat(cos) || [];
  return `Competența de soluționare:\n${linii.join(';\n')}.\n${ag.join('\n')}`;
}

// Tabelul nr. 2 – teren extravilan al comunelor, după categoria de folosință (Legea nr. 18/1991)
const G_T2 = [
  ['arabil', 'Arabil', 3], ['vie', 'Vie', 3], ['livada', 'Livadă', 3], ['faneata', 'Fâneață', 3], ['pasune', 'Pășune', 3],
  ['alte', 'Alte terenuri', 2], ['hb', 'HB – luciu de apă', 3], ['pseculara', 'Pădure seculară', 4], ['ptanara', 'Pădure tânără', 3],
  ['obstepas', 'Teren obște, pășune alpină (Asociația Moșnenilor, zona de munte)', 1.5], ['obstepad', 'Teren obște, pădure (Asociația Moșnenilor, zona de munte)', 2],
];
// Tabelul nr. 3 – garsoniere și apartamente (lei/mp suprafață utilă): [oraș, alte localități]
const G_T3 = [
  ['subsol', 'Subsol/demisol', 3415, 2376],
  ['p1', 'Parter, confort 1', 4428, 2970], ['p2', 'Parter, confort 2', 1768, 2376], ['p3', 'Parter, confort 3', 3537, 1930],
  ['e1c1', 'Etaj I, confort 1', 4826, 2970], ['e1c2', 'Etaj I, confort 2', 3915, 2376], ['e1c3', 'Etaj I, confort 3', 3192, 2004],
  ['e2c1', 'Etaj II, confort 1', 4455, 2970], ['e2c2', 'Etaj II, confort 2', 4826, 2376], ['e2c3', 'Etaj II, confort 3', 3192, 1930],
  ['e3c1', 'Etaj III, confort 1', 4630, 1633], ['e3c2', 'Etaj III, confort 2', 3712, 1485], ['e3c3', 'Etaj III, confort 3', 3057, 891],
  ['e4c1', 'Etaj IV, confort 1', 3685, null], ['e4c2', 'Etaj IV, confort 2', 2943, null], ['e4c3', 'Etaj IV, confort 3', 1930, null],
  ['e5c1', 'Etaj V, confort 1', 2943, null], ['e5c2', 'Etaj V, confort 2', 2349, null], ['e5c3', 'Etaj V, confort 3', 2349, null],
  ['mans', 'Mansardă, confort 1', 2598, null], ['camin', 'Cameră în cămin de nefamiliști', 1485, null],
];
// Tabelul nr. 4 – case individuale, zona urbană Curtea de Argeș (lei/mp suprafață construită)
const G_T4 = { beton: { A: 2025, B: 1755, C: 1485, D: 1215 }, lemn: { A: 1215, B: 1147, C: 945, D: 877 } };
// Tabelul nr. 5 – case individuale, zona rurală
const G_T5 = { beton: 1755, lemn: 1080 };
const G_STRUCT = { beton: 'Beton, cărămidă, BCA / zidărie', lemn: 'Lemn, paiantă și alte materiale' };
const G_VECHIME = [['0', 'Până la 30 de ani', 0], ['30', 'Între 30 și 40 de ani (−20%)', 20], ['41', 'Între 41 și 50 de ani (−30%)', 30], ['50', 'Peste 50 de ani (−35%)', 35]];
const G_AJUST = [['', 'Fără'], ['lemn89', 'Locuință din lemn sau structură metalică și lemn, construită după 1989 (valoarea de la beton/cărămidă −15%)'], ['cabana', 'Cabană sau casă de vacanță construită după 1989 (valoarea de la beton/cărămidă −15%)']];

const G_TIPURI = {
  ti: 'Teren – orașul Curtea de Argeș și localitățile arondate (tabelul nr. 1)',
  te: 'Teren extravilan al comunelor (tabelul nr. 2)',
  ap: 'Garsonieră / apartament (tabelul nr. 3)',
  cu: 'Casă individuală – zona urbană Curtea de Argeș (tabelul nr. 4)',
  cr: 'Casă individuală – zona rurală (tabelul nr. 5)',
};

const GR = { tip: 'ti', v: { loc: 'oras', cat: 'cc', zona: 'A', t2: 'arabil', ap: 'e1c1', aploc: 'oras', struct: 'beton', vech: '0', ajust: '' }, lista: [] };

const gnum = x => Math.max(0, Number(String(x ?? '').replace(/\s/g, '').replace(',', '.')) || 0);
const gr2 = n => Math.round(n * 100) / 100;

// Calculul unui element: { valoare, pasi[], eroare, descriere }
function grilaCalcul(tip, v) {
  const pasi = [];
  if (tip === 'ti') {
    const L = G_T1[v.loc] || G_T1.oras, mp = gnum(v.mp);
    let unit = null;
    const zona = v.loc === 'oras' ? v.zona : 'A';
    if (v.cat === 'cc' || v.cat === 'at') unit = L[v.cat][zona] ?? null;
    else if (v.cat === 'drum') unit = L.at[zona] != null ? L.at[zona] / 2 : null;
    else unit = L[v.cat] ?? null;
    if (unit == null) return { eroare: 'Grila nu are valoare pentru această combinație (localitate / categorie / zonă).' };
    pasi.push(`${L.l}, ${G_T1_CAT[v.cat]}${['cc', 'at', 'drum'].includes(v.cat) ? `, zona ${zona}` : ''}: ${lei(unit)}/mp${v.cat === 'drum' ? ' (jumătate din A.T)' : ''}`);
    if (!mp) return { eroare: 'Introduceți suprafața (mp).', pasi };
    pasi.push(`${mp} mp × ${lei(unit)} = ${lei(mp * unit)}`);
    return { valoare: gr2(mp * unit), pasi, descriere: `teren ${mp} mp, ${L.l}, ${G_T1_CAT[v.cat]}` };
  }
  if (tip === 'te') {
    const c = G_T2.find(x => x[0] === v.t2) || G_T2[0], mp = gnum(v.mp);
    pasi.push(`${c[1]}: ${lei(c[2])}/mp`);
    if (!mp) return { eroare: 'Introduceți suprafața (mp).', pasi };
    pasi.push(`${mp} mp × ${lei(c[2])} = ${lei(mp * c[2])}`);
    return { valoare: gr2(mp * c[2]), pasi, descriere: `teren extravilan ${mp} mp, ${c[1].toLowerCase()}` };
  }
  if (tip === 'ap') {
    const r = G_T3.find(x => x[0] === v.ap) || G_T3[0], mp = gnum(v.mp);
    let unit = v.aploc === 'alte' ? r[3] : r[2];
    if (unit == null) return { eroare: 'Grila nu are valoare pentru această poziție în „alte localități”.' };
    pasi.push(`${r[1]}, ${v.aploc === 'alte' ? 'alte localități' : 'orașul Curtea de Argeș'}: ${lei(unit)}/mp suprafață utilă`);
    if (v.nou) { unit *= 1.2; pasi.push(`Bloc construit începând cu anul 2000: +20% → ${lei(unit)}/mp`); }
    if (!mp) return { eroare: 'Introduceți suprafața utilă (mp).', pasi };
    pasi.push(`${mp} mp × ${lei(unit)} = ${lei(mp * unit)}`);
    return { valoare: gr2(mp * unit), pasi, descriere: `apartament ${mp} mp utili, ${r[1].toLowerCase()}` };
  }
  if (tip === 'cu' || tip === 'cr') {
    const ajust = v.ajust || '';
    const struct = ajust ? 'beton' : v.struct;
    let unit = tip === 'cu' ? G_T4[struct][v.zona] : G_T5[struct];
    pasi.push(`${tip === 'cu' ? `Zona urbană, zona ${v.zona}` : 'Zona rurală'}, ${G_STRUCT[struct]}: ${lei(unit)}/mp construit`);
    if (ajust) { unit *= 0.85; pasi.push(`${G_AJUST.find(x => x[0] === ajust)[1].replace(/ \(.*$/, '')}: −15% → ${lei(unit)}/mp`); }
    const vech = G_VECHIME.find(x => x[0] === v.vech) || G_VECHIME[0];
    if (vech[2]) { unit *= 1 - vech[2] / 100; pasi.push(`Vechime ${vech[1].toLowerCase().replace(/ \(.*$/, '')}: −${vech[2]}% → ${lei(unit)}/mp`); }
    let mp = gnum(v.mp);
    if (!mp && gnum(v.sol)) {
      const sol = gnum(v.sol), niv = Math.max(1, Math.round(gnum(v.niv) || 1));
      mp = sol * niv + (v.mans ? sol * 0.75 : 0);
      pasi.push(`Suprafața construită desfășurată: ${sol} mp × ${niv} niveluri${v.mans ? ` + mansardă/pod locuibil 75% × ${sol} mp` : ''} = ${gr2(mp)} mp`);
    }
    if (!mp) return { eroare: 'Introduceți suprafața construită desfășurată sau suprafața la sol și numărul de niveluri.', pasi };
    let val = mp * unit;
    pasi.push(`${gr2(mp)} mp × ${lei(unit)} = ${lei(val)}`);
    const sub = gnum(v.subsol);
    if (sub) { const s = sub * unit * 0.5; val += s; pasi.push(`Subsol (subsol tehnic, boxe, beci, garaj): ${sub} mp × 50% × ${lei(unit)} = ${lei(s)}`); }
    return { valoare: gr2(val), pasi, descriere: `casă ${gr2(mp)} mp construiți, ${tip === 'cu' ? `zona urbană ${v.zona}` : 'zona rurală'}` };
  }
  return { eroare: 'Tip necunoscut.' };
}

const gSel = (n, opts, val) => `<select data-grv="${n}">${opts.map(([k, l]) => `<option value="${k}" ${String(val) === String(k) ? 'selected' : ''}>${h(l)}</option>`).join('')}</select>`;
const gInp = (n, l, val, ph = '0') => `<label class="field" style="margin-top:8px"><span>${h(l)}</span><input type="text" inputmode="decimal" data-grv="${n}" value="${h(val ?? '')}" placeholder="${ph}"></label>`;
const gChk = (n, l, val) => `<label class="check" style="margin-top:8px;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" data-grv="${n}" ${val ? 'checked' : ''}><span>${h(l)}</span></label>`;
const gFld = (l, inner) => `<label class="field" style="margin-top:8px"><span>${h(l)}</span>${inner}</label>`;

function grilaCampuri() {
  const v = GR.v;
  if (GR.tip === 'ti') {
    const cats = Object.entries(G_T1_CAT).filter(([k]) => v.loc === 'oras' || !['extravilan', 'padure'].includes(k));
    return gFld('Localitatea', gSel('loc', Object.entries(G_T1).map(([k, x]) => [k, x.l]), v.loc))
      + gFld('Categoria de teren', gSel('cat', cats, v.cat))
      + (v.loc === 'oras' && ['cc', 'at', 'drum'].includes(v.cat) ? gFld('Zona', gSel('zona', ZONE.map(z => [z, 'Zona ' + z]), v.zona)) : '')
      + gInp('mp', 'Suprafața (mp)', v.mp);
  }
  if (GR.tip === 'te') return gFld('Categoria de folosință', gSel('t2', G_T2.map(x => [x[0], `${x[1]} – ${String(x[2]).replace('.', ',')} lei/mp`]), v.t2)) + gInp('mp', 'Suprafața (mp)', v.mp);
  if (GR.tip === 'ap') return gFld('Localitatea', gSel('aploc', [['oras', 'Orașul Curtea de Argeș (toate blocurile – zona A)'], ['alte', 'Alte localități arondate']], v.aploc))
    + gFld('Etajul și confortul', gSel('ap', G_T3.map(x => [x[0], x[1]]), v.ap))
    + gInp('mp', 'Suprafața utilă (mp)', v.mp) + gChk('nou', 'Bloc construit începând cu anul 2000 (+20%)', v.nou);
  const zona = GR.tip === 'cu' ? gFld('Zona', gSel('zona', ZONE.map(z => [z, 'Zona ' + z]), v.zona)) : '';
  return zona + gFld('Structura', gSel('struct', Object.entries(G_STRUCT), v.struct))
    + gFld('Vechimea', gSel('vech', G_VECHIME.map(x => [x[0], x[1]]), v.vech))
    + gFld('Situații speciale', gSel('ajust', G_AJUST, v.ajust))
    + gInp('mp', 'Suprafața construită desfășurată din documentația cadastrală (mp)', v.mp)
    + `<p class="muted small" style="margin:6px 0 0">Dacă nu există documentație cadastrală avizată: suprafața la sol × numărul de niveluri (+ 75% pentru mansardă/pod locuibil).</p>`
    + gInp('sol', 'Suprafața construită la sol (mp) – opțional', v.sol) + gInp('niv', 'Numărul de niveluri – opțional', v.niv, '1')
    + gChk('mans', 'Are mansardă sau pod locuibil', v.mans)
    + gInp('subsol', 'Subsol tehnic, boxe, beci, garaje (mp) – 50% din valoarea de la parter', v.subsol);
}

function grilaHtml() {
  const rez = grilaCalcul(GR.tip, GR.v);
  const total = GR.lista.reduce((s, x) => s + x.valoare, 0);
  return `<details class="card grila" ${GR.deschis ? 'open' : ''} id="grila">
    <summary><h2 style="display:inline">Grila notarială – Curtea de Argeș 2026</h2></summary>
    <p class="muted small" style="margin:8px 0">Se folosește pentru taxă numai dacă valoarea impozabilă a imobilului este contestată sau apreciată de instanță ca vădit derizorie [art. 31 alin. (3) O.U.G. nr. 80/2013]. Competența rămâne raportată la valoarea impozabilă (art. 104 C.proc.civ.). Grila acoperă numai circumscripția Judecătoriei Curtea de Argeș; zonele A–D se stabilesc după nomenclatorul de străzi al grilei.</p>
    ${gFld('Ce evaluați', gSel('tip', Object.entries(G_TIPURI), GR.tip))}
    ${grilaCampuri()}
    <div class="calc-result" style="text-transform:none;margin-top:10px">${rez.eroare ? '—' : lei(rez.valoare)}</div>
    <ol class="steps">${(rez.pasi || []).map(p => `<li>${h(p)}</li>`).join('')}${rez.eroare ? `<li>${h(rez.eroare)}</li>` : ''}</ol>
    ${GR.tip === 'cu' || GR.tip === 'cr' ? '<div class="callout warn small" style="margin-top:8px"><span class="pill u2">de verificat</span> Grila nu precizează cum se cumulează reducerea pentru vechime cu reducerea de 15%; aplicația le aplică succesiv. Pentru construcții nefinalizate grila cere raport de evaluare ANEVAR, iar pentru demisolul cu altă destinație – tariful destinației respective.</div>' : ''}
    ${GR.tip === 'ap' ? '<div class="callout warn small" style="margin-top:8px"><span class="pill u2">de verificat</span> Valorile sunt preluate exact din grilă. Câteva par neobișnuite (parter confort 2 – 1.768 lei; etaj II confort 2 – 4.826 lei, mai mult decât confortul 1). Mențiunea „se vor multiplica cu procentul de 20%” pentru blocurile din 2000 a fost aplicată ca majorare cu 20%.</div>' : ''}
    <div class="actions"><button class="btn" data-act="grilaAdauga">＋ Adaugă la evaluare</button></div>
    ${GR.lista.length ? `<ul class="list" style="margin-top:10px">${GR.lista.map((x, i) => `<li><span class="grow">${h(x.descriere)}</span><b class="nowrap">${lei(x.valoare)}</b><button class="icon-btn" data-act="grilaScoate" data-i="${i}" aria-label="Scoate">✕</button></li>`).join('')}</ul>
      <p style="margin:10px 0"><b>Valoare totală după grilă: ${lei(total)}</b></p>
      <div class="actions"><button class="btn primary" data-act="grilaFoloseste">Folosește valoarea pentru taxa de timbru</button></div>` : ''}
  </details>`;
}

function grilaAdauga() {
  const rez = grilaCalcul(GR.tip, GR.v);
  if (rez.eroare) return toast(rez.eroare);
  GR.lista.push({ descriere: rez.descriere, valoare: rez.valoare });
  GR.deschis = true;
  rerender();
}

function grilaFoloseste() {
  const total = gr2(GR.lista.reduce((s, x) => s + x.valoare, 0));
  if (!total) return;
  const t = TAXE.find(x => x.id === TX.sel);
  if (!t || !t.rule.imob) return toast('Alegeți întâi un obiect privind un imobil (ex. revendicare, partaj, uzucapiune).');
  Object.assign(TX.vals, { imob: '1', contest: '1', vgrila: String(total).replace('.', ',') });
  toast('Valoarea după grilă a fost preluată pentru calculul taxei.');
  rerender();
}

function grilaSet(n, val) {
  GR.deschis = true;
  if (n === 'tip') { GR.tip = val; return; }
  GR.v[n] = val;
  if (n === 'loc' && val !== 'oras' && ['extravilan', 'padure'].includes(GR.v.cat)) GR.v.cat = 'cc';
}

</script>
<script>
'use strict';
/* Aplicația separată „Taxă de timbru & competență”: aceeași logică ca în aplicația cabinetului
   (taxa.js, competenta.js, grila.js), fără date despre dosare sau clienți. */
const VERSIUNE = '2026.11.03.1';
const PAGINA = 'https://ovidiustoik.github.io/C.A.-Ioana-Stoica/calculator/';

const $ = (s, r = document) => r.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const empty = msg => `<div class="empty">${msg}</div>`;

function toast(msg, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), Math.max(ms, String(msg).length * 55));
}

function rerender() {
  const y = window.scrollY;
  $('#view').innerHTML = viewTaxa();
  window.scrollTo(0, y);
}

const ACT = {
  taxaAdauga: () => taxaAdauga(),
  taxaGoleste: () => { TX.cos = []; rerender(); },
  taxaScoate: d => { TX.cos.splice(Number(d.i), 1); rerender(); },
  taxaCopiaza: async () => {
    try { await navigator.clipboard.writeText(taxaText()); toast('Text copiat.'); } catch { toast('Selectați textul și copiați-l cu Ctrl+C.'); }
  },
  grilaAdauga: () => grilaAdauga(),
  grilaScoate: d => { GR.lista.splice(Number(d.i), 1); rerender(); },
  grilaFoloseste: () => grilaFoloseste(),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(el.dataset, el, e);
});

document.addEventListener('change', e => {
  if (e.target.dataset.tx === 'sel') { TX.sel = e.target.value; TX.vals = { f127: TX.vals.f127 }; rerender(); }
});

document.addEventListener('toggle', e => { if (e.target.id === 'grila') GR.deschis = e.target.open; }, true);

document.addEventListener('input', e => {
  const tv = e.target.dataset?.txv || (e.target.dataset?.tx === 'q' ? 'q' : null), gv = e.target.dataset?.grv;
  if (!tv && !gv) return;
  const val = e.target.type === 'checkbox' ? (e.target.checked ? '1' : '') : e.target.value;
  if (gv) grilaSet(gv, val); else if (tv === 'q') TX.q = val; else TX.vals[tv] = val;
  const pos = e.target.selectionStart, sel = gv ? `[data-grv="${gv}"]` : tv === 'q' ? '[data-tx="q"]' : `[data-txv="${tv}"]`;
  rerender();
  const again = $(sel);
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch { /* câmp fără cursor */ } }
});

// Versiunea instalată din fișier verifică, la pornire, dacă a apărut una nouă pe pagina publică.
async function verificaVersiunea() {
  if (location.protocol !== 'file:') return;
  try {
    const r = await fetch(PAGINA + 'versiune.json', { cache: 'no-store' });
    const j = await r.json();
    if (j.versiune && j.versiune > VERSIUNE) {
      $('#nou').innerHTML = `Există o versiune nouă (${h(j.versiune)}). <a href="${h(PAGINA + j.instalare)}" target="_blank" rel="noopener">Descărcați fișierul de instalare</a> și rulați-l din nou.`;
      $('#nou').hidden = false;
    }
  } catch { /* fără internet: rămâne versiunea instalată */ }
}

$('#versiune').textContent = VERSIUNE;
rerender();
verificaVersiunea();
// Publicată pe internet, pagina se poate instala ca aplicație (Chrome/Edge/Android) și merge și fără internet.
if (location.protocol.startsWith('http')) {
  document.head.insertAdjacentHTML('beforeend', '<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icon-192.png">');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
