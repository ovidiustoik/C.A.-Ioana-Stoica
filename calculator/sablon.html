<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taxă de timbru & competență</title>
  <meta name="description" content="Calculul taxei judiciare de timbru (O.U.G. nr. 80/2013) și stabilirea competenței generale, materiale și teritoriale.">
  <meta name="theme-color" content="#7a1f2b">
  <link rel="icon" href="{{ICON}}" type="image/svg+xml">
  <style>
{{CSS}}
.calc-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.calc-top strong { display: block; font-size: 1.1rem; }
.calc-top span { color: var(--muted); font-size: .85rem; }
.calc-main { max-width: 1320px; margin: 0 auto; padding: 16px; }
.calc-foot { max-width: 1320px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: .82rem; }
#nou { margin: 0 0 14px; }
  </style>
</head>
<body>
  <header class="calc-top">
    <img src="{{ICON}}" alt="" width="36" height="36">
    <div><strong>Taxă de timbru & competență</strong><span>O.U.G. nr. 80/2013 · Codul de procedură civilă · grila notarială Curtea de Argeș</span></div>
  </header>
  <main class="calc-main">
    <div id="nou" class="callout warn" hidden></div>
    <div id="view"></div>
  </main>
  <footer class="calc-foot">Instrument de lucru: verificați întotdeauna rezultatul cu textul legal în vigoare și cu practica instanței. Nu se salvează și nu se trimit date. Versiunea <span id="versiune"></span>.</footer>
  <div id="toast" role="status" aria-live="polite"></div>
{{SCRIPTS}}
</body>
</html>
