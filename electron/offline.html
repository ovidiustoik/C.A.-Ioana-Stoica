<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Cabinet Stoica</title>
  <style>
    :root { --bg: #f5f3ee; --ink: #1d2433; --muted: #6b7180; --primary: #7a1f2b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131519; --ink: #e9e7e2; --muted: #9aa0ad; --primary: #d36b7b; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.3rem; margin: 16px 0 8px; }
    p { color: var(--muted); max-width: 440px; margin: 0 auto 20px; }
    button { background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <img src="../build/icon.png" alt="">
    <h1>Nu există conexiune la internet</h1>
    <p>La prima pornire aplicația are nevoie de internet pentru a se descărca. După aceea funcționează și fără internet.</p>
    <button id="retry">Reîncearcă</button>
  </div>
  <script>
    const url = new URLSearchParams(location.search).get('url');
    document.getElementById('retry').onclick = () => { location.href = url; };
    setInterval(() => { if (navigator.onLine) fetch(url, { method: 'HEAD', cache: 'no-store' }).then(() => { location.href = url; }).catch(() => {}); }, 10000);
  </script>
</body>
</html>
